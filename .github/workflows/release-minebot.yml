name: Build minebot 1.0.2
on:
  push:
    branches: [minebot-release-1.0.2]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm --prefix runtime/mindcraft-final ci --omit=dev
      - run: npm run check
      - run: node scripts/prepare-dist.cjs
      - run: npm test
      - run: npm run dist -- --publish never
      - run: node tests/release-purity-smoke.cjs
      - name: Publish installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create minebot-v1.0.2 dist/minebot-setup-1.0.2.exe --target "$env:GITHUB_SHA" --title "minebot 1.0.2 测试版" --prerelease --notes "增加 CustomSkinLoader 本机皮肤导出，以及将生存建造需求交给同一游戏伙伴只读讨论。全自动采集和建造、跨客户端皮肤分发尚未实现；语音和公网联机需要用户环境实测。需要已登录的 WorkBuddy 客户端、游戏、Java、世界存档和兼容 Forge 服务端。"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

