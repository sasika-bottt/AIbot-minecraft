name: Build minebot 1.0.1
on:
  push:
    branches: [minebot-release-1.0.1]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm --prefix runtime/mindcraft-final ci --omit=dev
      - run: npm run check
      - run: node scripts/prepare-dist.cjs
      - run: npm test
      - run: npm run dist -- --publish never
      - run: node tests/release-purity-smoke.cjs
      - name: Publish installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create minebot-v1.0.1 dist/minebot-setup-1.0.1.exe --target "$env:GITHUB_SHA" --title "minebot 1.0.1 测试版" --prerelease --notes "修复世界进度接续、服务端模组配置保留和施工备份。需要已登录的 WorkBuddy 客户端及用户自己的游戏、Java、世界存档和兼容 Forge 服务端。此版本仍需更多新用户及语音联机测试；游戏内皮肤同步和全自动生存建造尚未实现。"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

